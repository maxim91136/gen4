<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Sonnentür</title>
<link rel="icon" href="zeichen.svg" type="image/svg+xml">
<link rel="stylesheet" href="stil.css">
<script type="module" src="seite.mjs"></script>
</head>
<body>
<header>
  <div class="kopfzeile">
    <h1>Sonnentür</h1>
    <button id="sprache" type="button" data-t="sprache">English</button>
  </div>
  <p class="untertitel" data-t="untertitel">Mit wem du heute die Sonne teilst, und wer dir gerade verschlossen ist.</p>
  <div class="ortszeile">
    <p id="ort-jetzt" class="hinweis"></p>
    <button id="ort-knopf" type="button" aria-expanded="false" aria-controls="ortswahl" data-t="ort_aendern" hidden>Ort ändern</button>
  </div>
  <div id="ortswahl" class="kasten ortswahl" hidden>
    <label for="ort-suche" data-t="ort_suchen"></label>
    <input id="ort-suche" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="ort-suche-hilfe">
    <p id="ort-suche-hilfe" class="klein" data-t="ort_suchen_hilfe"></p>
    <ul id="ort-treffer" class="treffer"></ul>
    <p class="klein" data-t="ort_koordinaten_hilfe"></p>
    <div class="felder">
      <label><span data-t="ort_breite"></span><input id="ort-breite" type="text" inputmode="text" autocomplete="off" size="8"></label>
      <label><span data-t="ort_laenge"></span><input id="ort-laenge" type="text" inputmode="text" autocomplete="off" size="8"></label>
      <button id="ort-nehmen" type="button" data-t="ort_nehmen"></button>
    </div>
    <div class="felder">
      <button id="ort-geraet" type="button" data-t="ort_geraet"></button>
      <button id="ort-zurueck" type="button" data-t="ort_zurueck" hidden></button>
    </div>
    <p class="klein" data-t="ort_geraet_hilfe"></p>
    <p id="ort-meldung" class="meldung" role="status" aria-live="polite"></p>
    <p class="klein" data-t="ort_uhr"></p>
  </div>
</header>

<noscript><p class="gross">Sonnentür rechnet in deinem Browser. Dafür muss JavaScript an sein.<br>Sonnentür does its sums in your browser. It needs JavaScript to be on.</p></noscript>

<main>
  <p id="laedt" class="klein" data-t="laedt"></p>
  <div id="inhalt" hidden>
    <section aria-labelledby="k1">
      <h2 id="k1" data-t="k_naechstes"></h2>
      <div id="naechstes" class="kasten sonne" aria-live="polite"></div>
    </section>

    <section aria-labelledby="k2">
      <h2 id="k2" data-t="k_heute"></h2>
      <div id="heute" class="kasten"></div>
    </section>

    <section aria-labelledby="k3">
      <h2 id="k3" data-t="k_tueren"></h2>
      <p id="zahlen" class="klein"></p>
      <ul id="tueren" class="liste"></ul>
      <details id="tueren-mehr">
        <summary id="tueren-mehr-text"></summary>
        <ul id="tueren-rest" class="liste"></ul>
      </details>
      <p id="nachbarn" class="klein" hidden></p>
    </section>

    <section aria-labelledby="k4">
      <h2 id="k4" data-t="k_fahrplan"></h2>
      <p id="fahrplan-zahl" class="klein"></p>
      <p id="fahrplan-knapp-text" class="klein"></p>
      <ol id="fahrplan-knapp" class="treffen"></ol>
      <details id="fahrplan-alle">
        <summary id="fahrplan-alle-text"></summary>
        <div id="fahrplan"></div>
      </details>
    </section>
  </div>
</main>

<footer>
  <h2 data-t="k_methode"></h2>
  <p data-t="methode"></p>
  <p data-t="modell"></p>
  <p data-t="ungeprueft"></p>
  <p data-t="quellen"></p>
  <p data-t="privat"></p>
  <p data-t="herkunft">Sonnentür wurde von zwei KI-Sitzungen erdacht und gebaut, als Experiment von Dreier Labs. Die Seite ist noch im Bau.</p>
  <p><a href="https://github.com/maxim91136/gen4" rel="noopener" data-t="repo">Regeln, Rechnung und Protokoll</a> · <a href="https://www.geonames.org/" rel="noopener">GeoNames</a></p>
</footer>
</body>
</html>
